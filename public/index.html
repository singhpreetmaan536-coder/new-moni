<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Ban Monitor</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: white;

            background:
                #050008;

            overflow-x: hidden;
        }


        /* =====================================================
           ANIME BACKGROUND
           Put anime.jpg inside public/
           ===================================================== */

        body::before {
            content: "";

            position: fixed;
            inset: -8%;

            z-index: -10;

            background-image:
                url("./anime.jpg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            transform: scale(1.08);

            animation:
                animeMove
                18s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes animeMove {

            0% {
                transform:
                    scale(1.08)
                    translate3d(0, 0, 0);
            }

            50% {
                transform:
                    scale(1.13)
                    translate3d(-1%, 1%, 0);
            }

            100% {
                transform:
                    scale(1.08)
                    translate3d(1%, -1%, 0);
            }

        }


        /* =====================================================
           DARK + PURPLE OVERLAY
           ===================================================== */

        body::after {
            content: "";

            position: fixed;
            inset: 0;

            z-index: -9;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(168, 85, 247, 0.28),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(126, 34, 206, 0.25),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    rgba(0, 0, 0, 0.93),
                    rgba(25, 0, 45, 0.72),
                    rgba(0, 0, 0, 0.94)
                );
        }


        /* =====================================================
           FLOATING PURPLE GLOW
           ===================================================== */

        .glow {
            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            z-index: -5;

            filter: blur(90px);

            opacity: 0.25;
        }


        .glow-one {
            width: 260px;
            height: 260px;

            background: #a855f7;

            top: -80px;
            left: -100px;

            animation:
                floatOne
                10s
                ease-in-out
                infinite;
        }


        .glow-two {
            width: 320px;
            height: 320px;

            background: #7e22ce;

            right: -120px;
            bottom: -80px;

            animation:
                floatTwo
                12s
                ease-in-out
                infinite;
        }


        .glow-three {
            width: 180px;
            height: 180px;

            background: #c026d3;

            left: 45%;
            top: 40%;

            animation:
                floatThree
                8s
                ease-in-out
                infinite;
        }


        @keyframes floatOne {

            0%,
            100% {
                transform:
                    translate(0, 0);
            }

            50% {
                transform:
                    translate(100px, 100px);
            }

        }


        @keyframes floatTwo {

            0%,
            100% {
                transform:
                    translate(0, 0);
            }

            50% {
                transform:
                    translate(-100px, -80px);
            }

        }


        @keyframes floatThree {

            0%,
            100% {
                transform:
                    scale(1);

                opacity: 0.12;
            }

            50% {
                transform:
                    scale(1.5);

                opacity: 0.28;
            }

        }


        /* =====================================================
           CONTAINER
           ===================================================== */

        .main-container {
            width: min(850px, 94%);

            margin: auto;

            padding:
                35px
                0
                60px;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .main-header {
            text-align: center;

            margin-bottom: 30px;

            animation:
                headerEnter
                0.8s
                ease-out;
        }


        @keyframes headerEnter {

            from {
                opacity: 0;
                transform:
                    translateY(-25px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        .logo {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 70px;
            height: 70px;

            margin-bottom: 15px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #7e22ce,
                    #a855f7
                );

            box-shadow:
                0 0 25px
                rgba(168, 85, 247, 0.45);

            animation:
                logoPulse
                3s
                ease-in-out
                infinite;
        }


        @keyframes logoPulse {

            0%,
            100% {
                box-shadow:
                    0 0 20px
                    rgba(168, 85, 247, 0.35);
            }

            50% {
                box-shadow:
                    0 0 40px
                    rgba(168, 85, 247, 0.65);
            }

        }


        .main-title {
            font-size:
                clamp(28px, 5vw, 44px);

            font-weight: 900;

            letter-spacing: -1px;

            text-shadow:
                0 0 12px
                rgba(168, 85, 247, 0.8),

                0 0 30px
                rgba(168, 85, 247, 0.35);
        }


        .subtitle {
            margin-top: 8px;

            color:
                rgba(216, 180, 254, 0.7);

            font-size: 14px;
        }


        /* =====================================================
           GLASS CARD
           ===================================================== */

        .glass-card {
            background:
                linear-gradient(
                    145deg,
                    rgba(8, 3, 15, 0.88),
                    rgba(25, 5, 38, 0.78)
                );

            border:
                1px solid
                rgba(168, 85, 247, 0.28);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-radius:
                25px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.45),

                0 0 35px
                rgba(126, 34, 206, 0.08);

            transition:
                border-color
                0.3s ease,

                box-shadow
                0.3s ease,

                transform
                0.3s ease;
        }


        .glass-card:hover {
            border-color:
                rgba(168, 85, 247, 0.5);

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.5),

                0 0 45px
                rgba(168, 85, 247, 0.12);
        }


        /* =====================================================
           INPUT
           ===================================================== */

        #username {
            background:
                rgba(0, 0, 0, 0.55);

            border:
                1px solid
                rgba(168, 85, 247, 0.28);

            color: white;

            transition:
                all 0.25s ease;
        }


        #username::placeholder {
            color:
                rgba(255, 255, 255, 0.35);
        }


        #username:focus {
            border-color:
                #a855f7;

            box-shadow:
                0 0 0 3px
                rgba(168, 85, 247, 0.1),

                0 0 25px
                rgba(168, 85, 247, 0.18);
        }


        /* =====================================================
           PURPLE BUTTON
           ===================================================== */

        .purple-button {
            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #7e22ce,
                    #a855f7
                );

            color: white;

            border:
                1px solid
                rgba(216, 180, 254, 0.25);

            box-shadow:
                0 8px 25px
                rgba(126, 34, 206, 0.25);

            transition:
                all 0.25s ease;
        }


        .purple-button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 80%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.22),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                left 0.5s ease;
        }


        .purple-button:hover::before {
            left: 140%;
        }


        .purple-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 12px 35px
                rgba(168, 85, 247, 0.45);
        }


        .purple-button:active {
            transform:
                scale(0.97);
        }


        /* =====================================================
           PROFILE CARD
           ===================================================== */

        #profile-card {
            animation:
                profileEnter
                0.5s
                ease-out;
        }


        @keyframes profileEnter {

            from {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        #pfp {
            border-color:
                #a855f7 !important;

            box-shadow:
                0 0 25px
                rgba(168, 85, 247, 0.3);

            animation:
                pfpGlow
                3s
                ease-in-out
                infinite;
        }


        @keyframes pfpGlow {

            0%,
            100% {
                box-shadow:
                    0 0 20px
                    rgba(168, 85, 247, 0.25);
            }

            50% {
                box-shadow:
                    0 0 40px
                    rgba(168, 85, 247, 0.6);
            }

        }


        /* =====================================================
           STATS
           ===================================================== */

        .stat-box {
            background:
                rgba(0, 0, 0, 0.4);

            border:
                1px solid
                rgba(168, 85, 247, 0.15);

            border-radius:
                16px;

            transition:
                all 0.25s ease;
        }


        .stat-box:hover {
            transform:
                translateY(-4px);

            background:
                rgba(168, 85, 247, 0.08);

            border-color:
                rgba(168, 85, 247, 0.4);

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3),

                0 0 20px
                rgba(168, 85, 247, 0.1);
        }


        /* =====================================================
           STATUS
           ===================================================== */

        .status-active {
            color:
                #4ade80;

            text-shadow:
                0 0 10px
                rgba(74, 222, 128, 0.8),

                0 0 25px
                rgba(74, 222, 128, 0.35);
        }


        .status-banned {
            color:
                #f87171;

            text-shadow:
                0 0 10px
                rgba(248, 113, 113, 0.8),

                0 0 25px
                rgba(248, 113, 113, 0.35);
        }


        /* =====================================================
           MONITOR BUTTON
           ===================================================== */

        #monitor-btn {
            transition:
                all 0.25s ease;
        }


        #monitor-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 0 30px
                rgba(168, 85, 247, 0.35);
        }


        /* =====================================================
           LIVE LOG
           ===================================================== */

        #log {
            scrollbar-width:
                thin;

            scrollbar-color:
                #a855f7
                #08020d;
        }


        #log::-webkit-scrollbar {
            width: 7px;
        }


        #log::-webkit-scrollbar-track {
            background:
                #08020d;
        }


        #log::-webkit-scrollbar-thumb {
            background:
                linear-gradient(
                    #7e22ce,
                    #a855f7
                );

            border-radius:
                10px;
        }


        .log-card {
            animation:
                logEnter
                0.4s
                ease-out;
        }


        @keyframes logEnter {

            from {
                opacity: 0;
                transform:
                    translateX(10px);
            }

            to {
                opacity: 1;
                transform:
                    translateX(0);
            }

        }


        /* =====================================================
           LIVE DOT
           ===================================================== */

        .live-dot {
            display: inline-block;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                #a855f7;

            box-shadow:
                0 0 0 0
                rgba(168, 85, 247, 0.7);

            animation:
                livePulse
                1.8s
                infinite;
        }


        @keyframes livePulse {

            0% {
                box-shadow:
                    0 0 0 0
                    rgba(168, 85, 247, 0.7);
            }

            70% {
                box-shadow:
                    0 0 0 10px
                    rgba(168, 85, 247, 0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(168, 85, 247, 0);
            }

        }


        /* =====================================================
           SCROLLBAR
           ===================================================== */

        ::-webkit-scrollbar {
            width: 8px;
        }


        ::-webkit-scrollbar-track {
            background:
                #050008;
        }


        ::-webkit-scrollbar-thumb {
            background:
                linear-gradient(
                    #7e22ce,
                    #a855f7
                );

            border-radius:
                10px;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 640px) {

            .main-container {
                width: 94%;

                padding-top:
                    20px;
            }


            .glass-card {
                border-radius:
                    20px;
            }


            #profile-card
            .flex {
                gap: 15px;
            }


            #pfp {
                width: 90px;
                height: 90px;
            }


            #monitor-btn {
                padding:
                    12px 18px;

                font-size:
                    14px;
            }

        }

    </style>
</head>


<body>

    <!-- Floating purple lights -->

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="glow glow-three"></div>


    <div class="main-container">

        <!-- =================================================
             HEADER
             ================================================== -->

        <div class="main-header">

            <div class="logo">

                <i
                    class="fab fa-instagram text-4xl"
                ></i>

            </div>


            <h1
                class="main-title"
            >
                Instagram Ban Monitor
            </h1>


            <p
                class="subtitle"
            >
                Real-time ban / unban detection
            </p>

        </div>


        <!-- =================================================
             USERNAME INPUT
             ================================================== -->

        <div
            class="
                glass-card
                p-6
                sm:p-8
                mb-8
            "
        >

            <label
                class="
                    block
                    text-sm
                    text-purple-200/70
                    mb-2
                    font-semibold
                "
            >
                USERNAME
            </label>


            <div
                class="
                    flex
                    flex-col
                    sm:flex-row
                    gap-3
                "
            >

                <input
                    id="username"
                    type="text"
                    placeholder="@username"

                    class="
                        flex-1
                        rounded-2xl
                        px-6
                        py-4
                        text-lg
                        outline-none
                    "
                >


                <button
                    onclick="fetchProfile()"

                    class="
                        purple-button
                        px-8
                        py-4
                        rounded-2xl
                        font-bold
                        text-white
                    "
                >

                    <i
                        class="
                            fas
                            fa-search
                            mr-2
                        "
                    ></i>

                    CHECK PROFILE

                </button>

            </div>

        </div>


        <!-- =================================================
             PROFILE CARD
             ================================================== -->

        <div
            id="profile-card"

            class="
                hidden
                glass-card
                p-6
                sm:p-8
                mb-8
            "
        >

            <div
                class="
                    flex
                    flex-col
                    sm:flex-row
                    gap-6
                    items-center
                    sm:items-start
                "
            >

                <!-- Profile picture -->

                <img
                    id="pfp"

                    src=""

                    class="
                        w-28
                        h-28
                        rounded-2xl
                        object-cover
                        border-4
                    "

                    onerror="
                        this.src='https://via.placeholder.com/150?text=No+Image'
                    "
                >


                <!-- Profile details -->

                <div
                    class="
                        flex-1
                        w-full
                        text-center
                        sm:text-left
                    "
                >

                    <h2
                        id="fullname"

                        class="
                            text-2xl
                            font-bold
                            text-white
                        "
                    ></h2>


                    <p
                        id="user"

                        class="
                            text-purple-400
                            text-lg
                            font-semibold
                        "
                    ></p>


                    <p
                        id="bio"

                        class="
                            text-zinc-400
                            text-sm
                            mt-2
                            whitespace-pre-wrap
                        "
                    ></p>


                    <!-- =====================================
                         STATS
                         ====================================== -->

                    <div
                        class="
                            grid
                            grid-cols-3
                            gap-3
                            sm:gap-4
                            mt-5
                            text-center
                        "
                    >

                        <!-- Followers -->

                        <div
                            class="
                                stat-box
                                p-3
                            "
                        >

                            <div
                                id="followers"

                                class="
                                    text-xl
                                    font-bold
                                    text-purple-300
                                "
                            >
                                0
                            </div>


                            <div
                                class="
                                    text-xs
                                    text-zinc-500
                                    mt-1
                                "
                            >
                                Followers
                            </div>

                        </div>


                        <!-- Following -->

                        <div
                            class="
                                stat-box
                                p-3
                            "
                        >

                            <div
                                id="following"

                                class="
                                    text-xl
                                    font-bold
                                    text-purple-300
                                "
                            >
                                0
                            </div>


                            <div
                                class="
                                    text-xs
                                    text-zinc-500
                                    mt-1
                                "
                            >
                                Following
                            </div>

                        </div>


                        <!-- Posts -->

                        <div
                            class="
                                stat-box
                                p-3
                            "
                        >

                            <div
                                id="posts"

                                class="
                                    text-xl
                                    font-bold
                                    text-purple-300
                                "
                            >
                                0
                            </div>


                            <div
                                class="
                                    text-xs
                                    text-zinc-500
                                    mt-1
                                "
                            >
                                Posts
                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 STATUS + MONITOR BUTTON
                 ================================================== -->

            <div
                class="
                    mt-8
                    flex
                    flex-col
                    sm:flex-row
                    items-start
                    sm:items-center
                    justify-between
                    gap-5
                "
            >

                <div>

                    <div
                        class="
                            text-sm
                            text-zinc-400
                        "
                    >
                        CURRENT STATUS
                    </div>


                    <div
                        id="status"

                        class="
                            text-3xl
                            font-bold
                            mt-1
                        "
                    >
                        —
                    </div>

                </div>


                <button
                    id="monitor-btn"
                    onclick="toggleMonitor()"

                    class="
                        purple-button
                        px-8
                        sm:px-10
                        py-4
                        rounded-2xl
                        font-bold
                        text-lg
                        w-full
                        sm:w-auto
                    "
                >

                    <i
                        class="
                            fas
                            fa-play
                            mr-2
                        "
                    ></i>

                    START MONITOR

                </button>

            </div>

        </div>


        <!-- =================================================
             LIVE MONITOR LOG
             ================================================== -->

        <div
            class="
                glass-card
                p-6
            "
        >

            <div
                class="
                    flex
                    items-center
                    justify-between
                    mb-4
                "
            >

                <h3
                    class="
                        text-sm
                        font-semibold
                        text-purple-300
                    "
                >

                    <span
                        class="live-dot mr-2"
                    ></span>

                    LIVE MONITOR LOG

                </h3>


                <span
                    class="
                        text-xs
                        text-zinc-500
                    "
                >
                    LIVE
                </span>

            </div>


            <div
                id="log"

                class="
                    h-56
                    overflow-y-auto
                    font-mono
                    text-sm
                    space-y-1
                    rounded-xl
                    p-3
                "

                style="
                    background:
                        rgba(0,0,0,.35);

                    border:
                        1px solid
                        rgba(168,85,247,.10);
                "
            ></div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ORIGINAL LOGIC
         ===================================================== -->

    <script>

        let isMonitoring = false;

        let monitorInterval = null;

        let currentUsername = "";

        let lastStatus = "";


        /* =================================================
           LIVE LOG
           ================================================= */

        function addLog(
            msg,
            type = "normal"
        ) {

            const log =
                document.getElementById(
                    "log"
                );


            if (!log) {
                console.log(msg);
                return;
            }


            const time =
                new Date()
                    .toLocaleTimeString(
                        "en-US",
                        {
                            hour12: false
                        }
                    );


            let color =
                "text-zinc-300";


            if (
                type === "banned"
            ) {

                color =
                    "text-red-400";

            } else if (
                type === "active"
            ) {

                color =
                    "text-emerald-400";

            } else if (
                type === "purple"
            ) {

                color =
                    "text-purple-300";

            }


            const line =
                document.createElement(
                    "div"
                );


            line.className =
                `${color} log-card`;


            line.textContent =
                `[${time}] ${msg}`;


            log.prepend(
                line
            );


            /* Browser console also */

            console.log(
                `[${time}] ${msg}`
            );

        }


        /* =================================================
           STATUS
           ================================================= */

        function updateStatus(
            status
        ) {

            const el =
                document.getElementById(
                    "status"
                );


            if (
                status === "ACTIVE"
            ) {

                el.textContent =
                    "ACTIVE";


                el.className =
                    "text-3xl font-bold mt-1 status-active";


            } else {

                el.textContent =
                    "BANNED";


                el.className =
                    "text-3xl font-bold mt-1 status-banned";

            }

        }


        /* =================================================
           FETCH PROFILE
           ================================================= */

        async function fetchProfile() {

            const usernameInput =
                document.getElementById(
                    "username"
                );


            const username =
                usernameInput.value.trim();


            if (!username) {

                alert(
                    "Enter username"
                );

                return;

            }


            currentUsername =
                username
                    .replace(/^@/, "")
                    .trim();


            lastStatus = "";


            addLog(
                `Fetching profile for @${currentUsername}...`,
                "purple"
            );


            try {

                const res =
                    await fetch(
                        "/api/check",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username:
                                        currentUsername
                                })
                        }
                    );


                const data =
                    await res.json();


                console.log(
                    "API Response:",
                    data
                );


                /* Show profile card */

                document
                    .getElementById(
                        "profile-card"
                    )
                    .classList
                    .remove(
                        "hidden"
                    );


                /* =========================================
                   ACTIVE ACCOUNT
                   ========================================= */

                if (
                    data.exists &&
                    data.user
                ) {

                    const user =
                        data.user;


                    /* Profile picture */

                    document
                        .getElementById(
                            "pfp"
                        )
                        .src =
                        user.profile_pic ||
                        "";


                    /* Full name */

                    document
                        .getElementById(
                            "fullname"
                        )
                        .textContent =
                        user.full_name ||
                        user.username ||
                        currentUsername;


                    /* Username */

                    document
                        .getElementById(
                            "user"
                        )
                        .textContent =
                        `@${user.username || currentUsername}`;


                    /* Bio */

                    document
                        .getElementById(
                            "bio"
                        )
                        .textContent =
                        user.biography ||
                        "No bio";


                    /* Followers */

                    document
                        .getElementById(
                            "followers"
                        )
                        .textContent =
                        user.followers ??
                        "—";


                    /* Following */

                    document
                        .getElementById(
                            "following"
                        )
                        .textContent =
                        user.following ??
                        "—";


                    /* Posts */

                    document
                        .getElementById(
                            "posts"
                        )
                        .textContent =
                        user.posts ??
                        "—";


                    /* Status */

                    updateStatus(
                        "ACTIVE"
                    );


                    lastStatus =
                        "ACTIVE";


                    addLog(
                        `@${currentUsername} is ACTIVE`,
                        "active"
                    );

                }


                /* =========================================
                   BANNED / NOT FOUND
                   ========================================= */

                else {

                    document
                        .getElementById(
                            "pfp"
                        )
                        .src =
                        "https://via.placeholder.com/150?text=No+Image";


                    document
                        .getElementById(
                            "fullname"
                        )
                        .textContent =
                        currentUsername;


                    document
                        .getElementById(
                            "user"
                        )
                        .textContent =
                        `@${currentUsername}`;


                    document
                        .getElementById(
                            "bio"
                        )
                        .textContent =
                        "Account not found or banned";


                    document
                        .getElementById(
                            "followers"
                        )
                        .textContent =
                        "—";


                    document
                        .getElementById(
                            "following"
                        )
                        .textContent =
                        "—";


                    document
                        .getElementById(
                            "posts"
                        )
                        .textContent =
                        "—";


                    updateStatus(
                        "BANNED"
                    );


                    lastStatus =
                        "BANNED";


                    addLog(
                        `@${currentUsername} is BANNED`,
                        "banned"
                    );

                }


            } catch (e) {

                console.error(
                    "Profile fetch error:",
                    e
                );


                addLog(
                    "Failed to fetch profile",
                    "banned"
                );

            }

        }


        /* =================================================
           START / STOP MONITOR
           ================================================= */

        function toggleMonitor() {

            const btn =
                document.getElementById(
                    "monitor-btn"
                );


            /* =========================================
               STOP
               ========================================= */

            if (
                isMonitoring
            ) {

                clearInterval(
                    monitorInterval
                );


                isMonitoring =
                    false;


                btn.innerHTML = `
                    <i
                        class="fas fa-play mr-2"
                    ></i>
                    START MONITOR
                `;


                btn.className = `
                    purple-button
                    px-8
                    sm:px-10
                    py-4
                    rounded-2xl
                    font-bold
                    text-lg
                    w-full
                    sm:w-auto
                `;


                addLog(
                    "Monitoring stopped",
                    "purple"
                );


                return;

            }


            /* =========================================
               START
               ========================================= */

            if (
                !currentUsername
            ) {

                return alert(
                    "First check a profile"
                );

            }


            isMonitoring =
                true;


            btn.innerHTML = `
                <i
                    class="fas fa-stop mr-2"
                ></i>
                STOP MONITOR
            `;


            btn.className = `
                px-8
                sm:px-10
                py-4
                bg-red-600
                hover:bg-red-500
                text-white
                rounded-2xl
                font-bold
                text-lg
                w-full
                sm:w-auto
                transition
            `;


            addLog(
                `Started monitoring @${currentUsername}`,
                "purple"
            );


            /* Immediate check */

            checkStatus();


            /* Every 3 seconds */

            monitorInterval =
                setInterval(
                    checkStatus,
                    3000
                );

        }


        /* =================================================
           CHECK STATUS
           ================================================= */

        async function checkStatus() {

            if (
                !currentUsername
            ) {
                return;
            }


            try {

                const res =
                    await fetch(
                        "/api/check",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username:
                                        currentUsername
                                })
                        }
                    );


                const data =
                    await res.json();


                console.log(
                    `Monitor response @${currentUsername}:`,
                    data
                );


                let status;


                if (
                    data.exists
                ) {

                    status =
                        "ACTIVE";

                } else {

                    status =
                        "BANNED";

                }


                /* Detect status change */

                if (
                    lastStatus &&
                    lastStatus !== status
                ) {

                    addLog(
                        `STATUS CHANGED: @${currentUsername} ${lastStatus} → ${status}`,
                        status === "ACTIVE"
                            ? "active"
                            : "banned"
                    );

                } else {

                    addLog(
                        `@${currentUsername} → ${status}`,
                        status === "ACTIVE"
                            ? "active"
                            : "banned"
                    );

                }


                lastStatus =
                    status;


                updateStatus(
                    status
                );


                /* =========================================
                   If active, refresh profile information
                   ========================================= */

                if (
                    data.exists &&
                    data.user
                ) {

                    const user =
                        data.user;


                    document
                        .getElementById(
                            "profile-card"
                        )
                        .classList
                        .remove(
                            "hidden"
                        );


                    document
                        .getElementById(
                            "pfp"
                        )
                        .src =
                        user.profile_pic ||
                        "";


                    document
                        .getElementById(
                            "fullname"
                        )
                        .textContent =
                        user.full_name ||
                        user.username ||
                        currentUsername;


                    document
                        .getElementById(
                            "user"
                        )
                        .textContent =
                        `@${user.username || currentUsername}`;


                    document
                        .getElementById(
                            "bio"
                        )
                        .textContent =
                        user.biography ||
                        "No bio";


                    document
                        .getElementById(
                            "followers"
                        )
                        .textContent =
                        user.followers ??
                        "—";


                    document
                        .getElementById(
                            "following"
                        )
                        .textContent =
                        user.following ??
                        "—";


                    document
                        .getElementById(
                            "posts"
                        )
                        .textContent =
                        user.posts ??
                        "—";

                }


            } catch (e) {

                console.error(
                    "Monitor API error:",
                    e
                );


                addLog(
                    "API error",
                    "banned"
                );

            }

        }


        /* =================================================
           ENTER KEY
           ================================================= */

        document
            .getElementById(
                "username"
            )
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        fetchProfile();

                    }

                }
            );

    </script>
