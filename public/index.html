<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Ban Monitor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        body {
            background:
                linear-gradient(
                    135deg,
                    #0f0f0f 0%,
                    #1a1a2e 100%
                );

            font-family:
                'Inter',
                system-ui,
                sans-serif;
        }

        .status-active {
            color: #22c55e;
            text-shadow:
                0 0 10px #22c55e;
        }

        .status-banned {
            color: #ef4444;
            text-shadow:
                0 0 10px #ef4444;
        }

        .monitor-card {
            transition:
                all .2s ease;
        }

        .minimized .monitor-body {
            display: none;
        }

    </style>
</head>


<body class="min-h-screen text-white">

<div class="max-w-3xl mx-auto p-6">


    <!-- ==================================================
         HEADER
    ================================================== -->

    <div class="text-center mb-10">

        <h1 class="text-4xl font-bold tracking-tight">

            <i class="fas fa-eye text-yellow-400"></i>

            Instagram Ban Monitor

        </h1>

        <p class="text-zinc-400 mt-2">
            Real-time ban / unban detection
        </p>

    </div>



    <!-- ==================================================
         MONITOR HEADER
    ================================================== -->

    <div
        class="bg-zinc-900
               border border-zinc-700
               rounded-3xl
               p-6
               mb-8"
    >

        <div class="flex items-center justify-between">

            <div>

                <div
                    class="text-sm
                           text-zinc-400"
                >
                    MONITORS
                </div>

                <div
                    id="monitor-count"
                    class="text-2xl font-bold"
                >
                    0
                </div>

            </div>


            <!-- PLUS BUTTON -->

            <button
                onclick="addMonitor()"
                class="
                    w-12
                    h-12
                    rounded-2xl
                    bg-yellow-500
                    hover:bg-yellow-400
                    text-black
                    text-2xl
                    font-bold
                "
            >
                +
            </button>

        </div>

    </div>



    <!-- ==================================================
         MONITOR LIST
    ================================================== -->

    <div id="monitor-list"></div>



    <!-- ==================================================
         LIVE LOG
    ================================================== -->

    <div
        class="
            bg-zinc-900
            border border-zinc-700
            rounded-3xl
            p-6
        "
    >

        <h3
            class="
                text-sm
                font-semibold
                text-yellow-400
                mb-3
            "
        >
            LIVE MONITOR LOG
        </h3>


        <div
            id="log"
            class="
                h-48
                overflow-y-auto
                font-mono
                text-sm
                space-y-1
            "
        ></div>

    </div>

</div>



<script>


// ======================================================
// GLOBAL DATA
// ======================================================

let monitors = new Map();

let monitorCounter = 0;



// ======================================================
// LOG
// ======================================================

function addLog(
    msg,
    type = "normal"
) {

    const log =
        document.getElementById(
            'log'
        );


    const time =
        new Date().toLocaleTimeString(
            'en-US',
            {
                hour12: false
            }
        );


    const color =
        type === "banned"
            ? "text-red-400"
            : type === "active"
                ? "text-emerald-400"
                : "text-zinc-300";


    log.innerHTML =

        `<div class="${color}">
            [${time}] ${msg}
        </div>`

        +

        log.innerHTML;

}



// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    ).replace(
        /[&<>"']/g,
        c => ({

            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'

        }[c])
    );

}



// ======================================================
// FORMAT TIMER
// ======================================================

function formatElapsed(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(
                seconds || 0
            )
        );


    const hours =
        String(
            Math.floor(
                seconds / 3600
            )
        ).padStart(
            2,
            '0'
        );


    const minutes =
        String(
            Math.floor(
                (seconds % 3600) / 60
            )
        ).padStart(
            2,
            '0'
        );


    const secs =
        String(
            seconds % 60
        ).padStart(
            2,
            '0'
        );


    return `${hours}:${minutes}:${secs}`;

}



// ======================================================
// RENDER MONITOR
// ======================================================

function renderMonitorCard(
    monitor,
    minimized = false
) {

    const list =
        document.getElementById(
            'monitor-list'
        );


    const card =
        document.createElement(
            'div'
        );


    card.id =
        `monitor-${monitor.id}`;


    card.className =

        `monitor-card
         bg-zinc-900
         border border-zinc-700
         rounded-3xl
         p-6
         mb-6
         ${minimized ? 'minimized' : ''}`;


    card.innerHTML = `

        <!-- ==========================================
             CARD HEADER
        =========================================== -->

        <div
            class="
                flex
                items-center
                justify-between
                cursor-pointer
            "

            onclick="
                toggleMinimize('${monitor.id}')
            "
        >

            <div>

                <div
                    class="
                        text-xs
                        text-zinc-500
                    "
                >
                    MONITOR
                </div>


                <div
                    class="
                        font-bold
                        text-lg
                    "
                >

                    @<span
                        id="mini-user-${monitor.id}"
                    >
                        ${escapeHtml(
                            monitor.username ||
                            'new'
                        )}
                    </span>

                </div>

            </div>



            <div
                class="
                    flex
                    items-center
                    gap-3
                "
            >

                <span
                    id="mini-status-${monitor.id}"
                    class="
                        text-sm
                        font-bold
                    "
                >
                    —
                </span>


                <span
                    id="mini-time-${monitor.id}"
                    class="
                        font-mono
                        text-xs
                        text-zinc-400
                    "
                >
                    00:00:00
                </span>


                <!-- DELETE -->

                <button
                    onclick="
                        event.stopPropagation();
                        removeMonitor('${monitor.id}')
                    "

                    class="
                        w-9
                        h-9
                        rounded-xl
                        bg-zinc-800
                        hover:bg-red-600
                        text-zinc-300
                    "
                >

                    <i class="fas fa-trash"></i>

                </button>


                <i
                    id="chevron-${monitor.id}"
                    class="
                        fas
                        fa-chevron-down
                        text-zinc-500
                    "
                ></i>

            </div>

        </div>



        <!-- ==========================================
             MONITOR BODY
        =========================================== -->

        <div
            class="
                monitor-body
                mt-6
            "
        >


            <!-- USERNAME -->

            <div
                class="
                    flex
                    gap-3
                "
            >

                <input
                    id="input-${monitor.id}"

                    type="text"

                    placeholder="@username"

                    value="${escapeHtml(
                        monitor.username || ''
                    )}"

                    class="
                        flex-1
                        bg-black
                        border
                        border-zinc-700
                        focus:border-yellow-500
                        rounded-2xl
                        px-5
                        py-3
                        outline-none
                    "
                >


                <button
                    onclick="
                        fetchProfile('${monitor.id}')
                    "

                    class="
                        px-6
                        bg-yellow-500
                        hover:bg-yellow-600
                        text-black
                        rounded-2xl
                        font-bold
                    "
                >
                    CHECK
                </button>

            </div>



            <!-- ======================================
                 PROFILE
            ======================================= -->

            <div
                id="profile-${monitor.id}"
                class="
                    ${monitor.username
                        ? ''
                        : 'hidden'}
                    mt-6
                "
            >

                <div
                    class="
                        flex
                        gap-5
                        items-start
                    "
                >


                    <!-- PROFILE PIC -->

                    <img
                        id="pfp-${monitor.id}"

                        src=""

                        class="
                            w-24
                            h-24
                            rounded-2xl
                            object-cover
                            border-4
                            border-yellow-500
                        "

                        onerror="
                            this.src='https://via.placeholder.com/150?text=No+Image'
                        "
                    >



                    <div
                        class="flex-1"
                    >

                        <h2
                            id="fullname-${monitor.id}"
                            class="
                                text-xl
                                font-bold
                            "
                        ></h2>


                        <p
                            id="user-${monitor.id}"
                            class="
                                text-yellow-400
                            "
                        ></p>


                        <p
                            id="bio-${monitor.id}"
                            class="
                                text-zinc-400
                                text-sm
                                mt-2
                                whitespace-pre-wrap
                            "
                        ></p>



                        <!-- STATS -->

                        <div
                            class="
                                grid
                                grid-cols-3
                                gap-3
                                mt-4
                                text-center
                            "
                        >

                            <div
                                class="
                                    bg-black
                                    rounded-xl
                                    p-2
                                "
                            >

                                <div
                                    id="followers-${monitor.id}"
                                    class="
                                        font-bold
                                        text-emerald-400
                                    "
                                >
                                    —
                                </div>

                                <div
                                    class="
                                        text-xs
                                        text-zinc-500
                                    "
                                >
                                    Followers
                                </div>

                            </div>



                            <div
                                class="
                                    bg-black
                                    rounded-xl
                                    p-2
                                "
                            >

                                <div
                                    id="following-${monitor.id}"
                                    class="
                                        font-bold
                                        text-emerald-400
                                    "
                                >
                                    —
                                </div>

                                <div
                                    class="
                                        text-xs
                                        text-zinc-500
                                    "
                                >
                                    Following
                                </div>

                            </div>



                            <div
                                class="
                                    bg-black
                                    rounded-xl
                                    p-2
                                "
                            >

                                <div
                                    id="posts-${monitor.id}"
                                    class="
                                        font-bold
                                        text-emerald-400
                                    "
                                >
                                    —
                                </div>

                                <div
                                    class="
                                        text-xs
                                        text-zinc-500
                                    "
                                >
                                    Posts
                                </div>

                            </div>

                        </div>

                    </div>

                </div>



                <!-- ==================================
                     STATUS / TIMER / BUTTON
                =================================== -->

                <div
                    class="
                        mt-6
                        flex
                        items-center
                        justify-between
                        gap-4
                    "
                >

                    <!-- STATUS -->

                    <div>

                        <div
                            class="
                                text-xs
                                text-zinc-500
                            "
                        >
                            CURRENT STATUS
                        </div>


                        <div
                            id="status-${monitor.id}"
                            class="
                                text-3xl
                                font-bold
                                mt-1
                            "
                        >
                            —
                        </div>

                    </div>



                    <!-- TIMER -->

                    <div
                        class="text-right"
                    >

                        <div
                            class="
                                text-xs
                                text-zinc-500
                            "
                        >
                            MONITORING TIME
                        </div>


                        <div
                            id="time-${monitor.id}"
                            class="
                                font-mono
                                text-lg
                                text-yellow-400
                            "
                        >
                            00:00:00
                        </div>

                    </div>



                    <!-- BUTTON -->

                    <button
                        id="btn-${monitor.id}"

                        onclick="
                            toggleMonitor('${monitor.id}')
                        "

                        class="
                            px-7
                            py-3
                            bg-gradient-to-r
                            from-yellow-400
                            to-amber-500

                            rounded-2xl

                        START MONITOR

    list.prepend(

    );

}



// ======================================================
// MINIMIZE / EXPAND
// ======================================================

function toggleMinimize(id) {

    const card =
        document.getElementById(
            `monitor-${id}`
        );


    if (!card) return;


    card.classList.toggle(
        'minimized'
    );


    const icon =
        document.getElementById(
            `chevron-${id}`
        );


    icon.className =
        card.classList.contains(
            'minimized'
        )

            ? 'fas fa-chevron-right text-zinc-500'

            : 'fas fa-chevron-down text-zinc-500';

}



// ======================================================
// MINIMIZE OTHER CARDS
// ======================================================

function minimizeOthers(
    exceptId
) {

    document
        .querySelectorAll(
            '.monitor-card'
        )
        .forEach(card => {

            if (
                card.id !==
                `monitor-${exceptId}`
            ) {

                card.classList.add(
                    'minimized'
                );


                const id =
                    card.id.replace(
                        'monitor-',
                        ''
                    );


                const icon =
                    document.getElementById(
                        `chevron-${id}`
                    );


                if (icon) {

                    icon.className =
                        'fas fa-chevron-right text-zinc-500';

                }

            }

        });

}



// ======================================================
// ADD MONITOR
// ======================================================

function addMonitor() {

    const id =
        `m${++monitorCounter}`;


    const monitor = {

        id,

        username: '',

        monitoring: false,

        startedAt: null

    };


    monitors.set(
        id,
        monitor
    );


    renderMonitorCard(
        monitor,
        false
    );


    // Previous monitor minimize

    minimizeOthers(id);


    document
        .getElementById(
            `input-${id}`
        )
        .focus();


    updateCount();

}



// ======================================================
// UPDATE COUNT
// ======================================================

function updateCount() {

    document
        .getElementById(
            'monitor-count'
        )
        .textContent =
            monitors.size;

}



// ======================================================
// REMOVE MONITOR
// ======================================================

async function removeMonitor(
    id
) {

    const monitor =
        monitors.get(id);


    if (
        monitor &&
        monitor.monitoring &&
        monitor.username
    ) {

        try {

            await fetch(
                '/api/monitor/stop',
                {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            username:
                                monitor.username
                        })

                }
            );

        } catch (e) {}

    }


    monitors.delete(id);


    const card =
        document.getElementById(
            `monitor-${id}`
        );


    if (card) {

        card.remove();

    }


    updateCount();

}



// ======================================================
// FETCH PROFILE
// ======================================================

async function fetchProfile(
    id
) {

    const monitor =
        monitors.get(id);


    const input =
        document.getElementById(
            `input-${id}`
        );


    const username =
        input.value
            .trim()
            .replace('@', '')
            .toLowerCase();


    if (!username) {

        return alert(
            'Enter username'
        );

    }


    monitor.username =
        username;


    document
        .getElementById(
            `mini-user-${id}`
        )
        .textContent =
            username;


    document
        .getElementById(
            `profile-${id}`
        )
        .classList
        .remove(
            'hidden'
        );


    addLog(
        `Fetching profile for @${username}...`
    );


    try {

        const res =
            await fetch(
                '/api/check',
                {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            username
                        })

                }
            );


        const data =
            await res.json();


        if (
            data.exists &&
            data.user
        ) {

            document
                .getElementById(
                    `pfp-${id}`
                )
                .src =
                    data.user.profile_pic ||
                    '';


            document
                .getElementById(
                    `fullname-${id}`
                )
                .textContent =
                    data.user.full_name ||
                    data.user.username;


            document
                .getElementById(
                    `user-${id}`
                )
                .textContent =
                    `@${data.user.username}`;


            document
                .getElementById(
                    `bio-${id}`
                )
                .textContent =
                    data.user.biography ||
                    'No bio';


            document
                .getElementById(
                    `followers-${id}`
                )
                .textContent =
                    data.user.followers;


            document
                .getElementById(
                    `following-${id}`
                )
                .textContent =
                    data.user.following;


            document
                .getElementById(
                    `posts-${id}`
                )
                .textContent =
                    data.user.posts;


            setStatus(
                id,
                'ACTIVE'
            );


        } else {

            document
                .getElementById(
                    `pfp-${id}`
                )
                .src = '';


            document
                .getElementById(
                    `fullname-${id}`
                )
                .textContent =
                    username;


            document
                .getElementById(
                    `user-${id}`
                )
                .textContent =
                    `@${username}`;


            document
                .getElementById(
                    `bio-${id}`
                )
                .textContent =
                    'Account not found or banned';


            document
                .getElementById(
                    `followers-${id}`
                )
                .textContent =
                    '—';


            document
                .getElementById(
                    `following-${id}`
                )
                .textContent =
                    '—';


            document
                .getElementById(
                    `posts-${id}`
                )
                .textContent =
                    '—';


            setStatus(
                id,
                'BANNED'
            );

        }


    } catch (e) {

        addLog(
            `@${username}: Failed to fetch profile`,
            'banned'
        );

    }

}



// ======================================================
// SET STATUS
// ======================================================

function setStatus(
    id,
    status
) {

    const el =
        document.getElementById(
            `status-${id}`
        );


    const mini =
        document.getElementById(
            `mini-status-${id}`
        );


    el.textContent =
        status;


    if (
        status === 'ACTIVE'
    ) {

        el.className =
            'text-3xl font-bold mt-1 status-active';

        mini.className =
            'text-sm font-bold status-active';

    } else {

        el.className =
            'text-3xl font-bold mt-1 status-banned';

        mini.className =
            'text-sm font-bold status-banned';

    }


    mini.textContent =
        status;

}



// ======================================================
// START / STOP MONITOR
// ======================================================

async function toggleMonitor(
    id
) {

    const monitor =
        monitors.get(id);


    if (!monitor)
        return;


    if (
        !monitor.username
    ) {

        return alert(
            'First check a profile'
        );

    }


    const btn =
        document.getElementById(
            `btn-${id}`
        );


    // ================================================
    // STOP
    // ================================================

    if (
        monitor.monitoring
    ) {

        try {

            await fetch(
                '/api/monitor/stop',
                {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            username:
                                monitor.username
                        })

                }
            );

        } catch (e) {}


        monitor.monitoring =
            false;


        monitor.startedAt =
            null;


        btn.textContent =
            'START MONITOR';


        btn.className =
            `
            px-7
            py-3
            bg-gradient-to-r
            from-yellow-400
            to-amber-500
            text-black
            rounded-2xl
            font-bold
            `;


        addLog(
            `Monitoring stopped for @${monitor.username}`
        );


        return;

    }



    // ================================================
    // START
    // ================================================

    const res =
        await fetch(
            '/api/monitor/start',
            {

                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify({
                        username:
                            monitor.username
                    })

            }
        );


    const data =
        await res.json();


    if (
        !data.success
    ) {

        addLog(
            `Failed to start @${monitor.username}`,
            'banned'
        );

        return;

    }


    monitor.monitoring =
        true;


    monitor.startedAt =
        Date.now();


    btn.textContent =
        'STOP MONITOR';


    btn.className =
        `
        px-7
        py-3
        bg-red-600
        text-white
        rounded-2xl
        font-bold
        `;


    addLog(
        `Started monitoring @${monitor.username}`
    );


    // New active card stays expanded

    minimizeOthers(id);

}



// ======================================================
// RESTORE BACKEND MONITORS
// ======================================================

async function restoreBackendMonitors() {

    try {

        const res =
            await fetch(
                '/api/monitor/status'
            );


        const data =
            await res.json();


        if (
            !data.success
        )
            return;


        for (
            const saved
            of data.monitors
        ) {

            const id =
                `m${++monitorCounter}`;


            const monitor = {

                id,

                username:
                    saved.username,

                monitoring: true,

                startedAt:
                    saved.startedAt

            };


            monitors.set(
                id,
                monitor
            );


            // Restore minimized

            renderMonitorCard(
                monitor,
                true
            );


            document
                .getElementById(
                    `profile-${id}`
                )
                .classList
                .remove(
                    'hidden'
                );


            const btn =
                document.getElementById(
                    `btn-${id}`
                );


            btn.textContent =
                'STOP MONITOR';


            btn.className =
                `
                px-7
                py-3
                bg-red-600
                text-white
                rounded-2xl
                font-bold
                `;


            document
                .getElementById(
                    `input-${id}`
                )
                .value =
                    saved.username;


            // Fetch current profile

            await fetchProfile(
                id
            );


            addLog(
                `Restored monitoring @${saved.username}`,
                'active'
            );

        }


        // If there are no saved monitors,
        // create first empty monitor

        if (
            monitors.size === 0
        ) {

            addMonitor();

        } else {

            // Last restored card expanded

            const lastId =
                [
                    ...monitors.keys()
                ].at(-1);


            minimizeOthers(
                lastId
            );

        }


        updateCount();


    } catch (e) {

        addLog(
            'Failed to restore backend monitors',
            'banned'
        );


        if (
            monitors.size === 0
        ) {

            addMonitor();

        }

    }

}



// ======================================================
// UPDATE FRONTEND TIMERS
// ======================================================

function updateTimers() {

    const now =
        Date.now();


    monitors.forEach(
        monitor => {

            if (
                !monitor.monitoring ||
                !monitor.startedAt
            ) {

                return;

            }


            const seconds =
                Math.floor(
                    (
                        now -
                        monitor.startedAt
                    ) / 1000
                );


            const value =
                formatElapsed(
                    seconds
                );


            const big =
                document.getElementById(
                    `time-${monitor.id}`
                );


            const mini =
                document.getElementById(
                    `mini-time-${monitor.id}`
                );


            if (big) {

                big.textContent =
                    value;

            }


            if (mini) {

                mini.textContent =
                    value;

            }

        }
    );

}



// Update timer every second

setInterval(
    updateTimers,
    1000
);



// ======================================================
// PAGE LOAD
// ======================================================

window.addEventListener(
    'DOMContentLoaded',
    () => {

        restoreBackendMonitors();

    }
);

</script>
