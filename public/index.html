<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Monitor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            background: #05030a;
            overflow-x: hidden;
        }

        /* =========================================
           ANIME BACKGROUND
        ========================================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -3;

            background-image:
                linear-gradient(
                    rgba(5, 0, 15, 0.78),
                    rgba(5, 0, 15, 0.90)
                ),
                url("./anime.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            transform: scale(1.05);
            animation: backgroundMove 18s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(168, 85, 247, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(126, 34, 206, 0.20),
                    transparent 35%
                );

            animation: glowMove 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes backgroundMove {
            0% {
                transform: scale(1.05) translate3d(0, 0, 0);
            }

            50% {
                transform: scale(1.09) translate3d(-10px, -8px, 0);
            }

            100% {
                transform: scale(1.06) translate3d(10px, 8px, 0);
            }
        }

        @keyframes glowMove {
            0% {
                opacity: .55;
            }

            100% {
                opacity: 1;
            }
        }

        /* =========================================
           GLASS CARDS
        ========================================= */

        .glass {
            background: rgba(10, 6, 20, 0.76);
            border: 1px solid rgba(168, 85, 247, 0.28);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .45),
                0 0 30px rgba(126, 34, 206, .08);

            transition: .25s ease;
        }

        .glass:hover {
            border-color: rgba(168, 85, 247, .48);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, .55),
                0 0 35px rgba(168, 85, 247, .14);
        }

        /* =========================================
           MONITOR CARD
        ========================================= */

        .monitor-card {
            transition:
                transform .25s ease,
                opacity .25s ease,
                box-shadow .25s ease,
                border-color .25s ease;
        }

        .monitor-card:hover {
            transform: translateY(-2px);
        }

        .minimized .monitor-body {
            display: none;
        }

        /* =========================================
           STATUS
        ========================================= */

        .status-active {
            color: #4ade80;
            text-shadow:
                0 0 8px rgba(74, 222, 128, .8),
                0 0 20px rgba(74, 222, 128, .35);
        }

        .status-banned {
            color: #f87171;
            text-shadow:
                0 0 8px rgba(248, 113, 113, .8),
                0 0 20px rgba(248, 113, 113, .35);
        }

        /* =========================================
           INPUT
        ========================================= */

        .monitor-input {
            transition: .2s ease;
        }

        .monitor-input:focus {
            border-color: #a855f7 !important;

            box-shadow:
                0 0 0 2px rgba(168, 85, 247, .12),
                0 0 25px rgba(168, 85, 247, .10);
        }

        /* =========================================
           BUTTONS
        ========================================= */

        .add-btn {
            transition: .2s ease;
            box-shadow: 0 0 20px rgba(168, 85, 247, .18);
        }

        .add-btn:hover {
            transform: rotate(90deg) scale(1.06);
            box-shadow: 0 0 30px rgba(168, 85, 247, .35);
        }

        .check-btn {
            transition: .2s ease;
        }

        .check-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 25px rgba(168, 85, 247, .25);
        }

        /* =========================================
           LOG
        ========================================= */

        #log {
            scrollbar-width: thin;
            scrollbar-color: #7e22ce #090611;
        }

        #log::-webkit-scrollbar {
            width: 6px;
        }

        #log::-webkit-scrollbar-track {
            background: #090611;
        }

        #log::-webkit-scrollbar-thumb {
            background: #7e22ce;
            border-radius: 20px;
        }

        /* =========================================
           ENTRY ANIMATION
        ========================================= */

        .monitor-card {
            animation: cardIn .35s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================================
           TITLE GLOW
        ========================================= */

        .title-glow {
            text-shadow:
                0 0 12px rgba(168, 85, 247, .45),
                0 0 35px rgba(126, 34, 206, .18);
        }
    </style>
</head>

<body class="min-h-screen text-white">

<div class="max-w-4xl mx-auto p-5 md:p-8">

    <!-- HEADER -->
    <div class="text-center mb-10">

        <div class="inline-flex items-center justify-center
                    w-20 h-20 rounded-3xl
                    bg-purple-600/20
                    border border-purple-500/30
                    mb-5">

            <i class="fab fa-instagram text-purple-400 text-3xl"></i>

        </div>

        <h1 class="text-4xl md:text-5xl font-black tracking-tight title-glow">
            Instagram Monitor
        </h1>

        <p class="text-zinc-400 mt-3">
            Real-time ban / unban detection
        </p>

    </div>


    <!-- MONITOR HEADER -->
    <div class="glass rounded-3xl p-5 md:p-6 mb-7">

        <div class="flex items-center justify-between">

            <div>

                <div class="text-xs tracking-widest
                            text-purple-400 font-semibold">
                    ACTIVE MONITORS
                </div>

                <div id="monitor-count"
                     class="text-3xl font-black mt-1">
                    0
                </div>

            </div>


            <!-- PLUS BUTTON -->
            <button
                onclick="addMonitor()"
                class="add-btn
                       w-14 h-14
                       rounded-2xl
                       bg-gradient-to-br
                       from-purple-500
                       to-violet-700
                       hover:from-purple-400
                       hover:to-violet-600
                       text-white
                       text-3xl
                       font-bold">

                +

            </button>

        </div>

    </div>


    <!-- MONITOR LIST -->
    <div id="monitor-list"></div>


    <!-- LIVE LOG -->
    <div class="glass rounded-3xl p-6 mt-6">

        <div class="flex items-center justify-between mb-4">

            <h3 class="text-sm font-semibold
                       text-purple-400 tracking-wider">

                <i class="fas fa-terminal mr-2"></i>
                LIVE MONITOR LOG

            </h3>

            <span class="text-xs text-zinc-500">
                LIVE
            </span>

        </div>

        <div id="log"
             class="h-52 overflow-y-auto
                    font-mono text-sm
                    space-y-1">
        </div>

    </div>

</div>


<script>

let monitors = new Map();
let monitorCounter = 0;


/* =========================================
   LOG
========================================= */

function addLog(msg, type = "normal") {

    const log = document.getElementById('log');

    const time = new Date().toLocaleTimeString(
        'en-US',
        { hour12: false }
    );

    const color =
        type === "banned"
            ? "text-red-400"
            : type === "active"
                ? "text-emerald-400"
                : "text-zinc-300";

    log.innerHTML =
        `<div class="${color}">
            [${time}] ${msg}
        </div>`
        +
        log.innerHTML;

    console.log(`[${time}] ${msg}`);
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value ?? '').replace(
        /[&<>\"']/g,
        c => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '\"':'&quot;',
            "'":'&#039;'
        }[c])
    );

}


/* =========================================
   TIMER FORMAT
========================================= */

function formatElapsed(seconds) {

    seconds = Math.max(
        0,
        Math.floor(seconds || 0)
    );

    const h = String(
        Math.floor(seconds / 3600)
    ).padStart(2, '0');

    const m = String(
        Math.floor((seconds % 3600) / 60)
    ).padStart(2, '0');

    const s = String(
        seconds % 60
    ).padStart(2, '0');

    return `${h}:${m}:${s}`;

}


/* =========================================
   RENDER MONITOR CARD
========================================= */

function renderMonitorCard(
    monitor,
    minimized = false
) {

    const list =
        document.getElementById('monitor-list');

    const card =
        document.createElement('div');

    card.id =
        `monitor-${monitor.id}`;

    card.className =
        `monitor-card glass rounded-3xl p-6 mb-6
         ${minimized ? 'minimized' : ''}`;


    card.innerHTML = `

        <!-- CARD HEADER -->

        <div
            class="flex items-center justify-between cursor-pointer"
            onclick="toggleMinimize('${monitor.id}')">

            <div>

                <div class="text-xs
                            text-zinc-500
                            tracking-widest">
                    MONITOR
                </div>

                <div class="font-bold text-lg">

                    @<span id="mini-user-${monitor.id}">
                        ${escapeHtml(
                            monitor.username || 'new'
                        )}
                    </span>

                </div>

            </div>


            <div class="flex items-center gap-3">

                <span
                    id="mini-status-${monitor.id}"
                    class="text-sm font-bold">
                    —
                </span>

                <span
                    id="mini-time-${monitor.id}"
                    class="font-mono
                           text-xs
                           text-zinc-400">
                    00:00:00
                </span>


                <!-- DELETE -->

                <button
                    onclick="
                        event.stopPropagation();
                        removeMonitor('${monitor.id}')
                    "
                    class="w-9 h-9
                           rounded-xl
                           bg-zinc-900
                           hover:bg-red-600
                           text-zinc-300
                           transition">

                    <i class="fas fa-trash"></i>

                </button>


                <i
                    id="chevron-${monitor.id}"
                    class="fas fa-chevron-down
                           text-zinc-500">
                </i>

            </div>

        </div>


        <!-- CARD BODY -->

        <div class="monitor-body mt-6">


            <!-- INPUT -->

            <div class="flex flex-col sm:flex-row gap-3">

                <input
                    id="input-${monitor.id}"
                    type="text"
                    placeholder="@username"
                    value="${escapeHtml(
                        monitor.username || ''
                    )}"

                    class="monitor-input
                           flex-1
                           bg-black/70
                           border border-zinc-700
                           rounded-2xl
                           px-5 py-3
                           outline-none">

                <button
                    onclick="
                        event.stopPropagation();
                        fetchProfile('${monitor.id}')
                    "
                    class="check-btn
                           px-7 py-3
                           bg-gradient-to-r
                           from-purple-500
                           to-violet-700
                           hover:from-purple-400
                           hover:to-violet-600
                           text-white
                           rounded-2xl
                           font-bold">

                    <i class="fas fa-search mr-2"></i>
                    CHECK

                </button>

            </div>


            <!-- PROFILE -->

            <div
                id="profile-${monitor.id}"
                class="${
                    monitor.username
                        ? ''
                        : 'hidden'
                } mt-6">

                <div class="flex
                            flex-col
                            sm:flex-row
                            gap-5
                            items-start">


                    <!-- PROFILE PIC -->

                    <img
                        id="pfp-${monitor.id}"
                        src=""
                        class="w-24 h-24
                               rounded-2xl
                               object-cover
                               border-4
                               border-purple-500"

                        onerror="
                            this.src=
                            'https://via.placeholder.com/150?text=No+Image'
                        ">


                    <div class="flex-1 w-full">

                        <h2
                            id="fullname-${monitor.id}"
                            class="text-xl
                                   font-bold">
                        </h2>

                        <p
                            id="user-${monitor.id}"
                            class="text-purple-400">
                        </p>

                        <p
                            id="bio-${monitor.id}"
                            class="text-zinc-400
                                   text-sm
                                   mt-2
                                   whitespace-pre-wrap">
                        </p>


                        <!-- STATS -->

                        <div
                            class="grid
                                   grid-cols-3
                                   gap-3
                                   mt-4
                                   text-center">

                            <div
                                class="bg-black/70
                                       rounded-xl
                                       p-3">

                                <div
                                    id="followers-${monitor.id}"
                                    class="font-bold
                                           text-emerald-400">
                                    —
                                </div>

                                <div
                                    class="text-xs
                                           text-zinc-500">
                                    Followers
                                </div>

                            </div>


                            <div
                                class="bg-black/70
                                       rounded-xl
                                       p-3">

                                <div
                                    id="following-${monitor.id}"
                                    class="font-bold
                                           text-emerald-400">
                                    —
                                </div>

                                <div
                                    class="text-xs
                                           text-zinc-500">
                                    Following
                                </div>

                            </div>


                            <div
                                class="bg-black/70
                                       rounded-xl
                                       p-3">

                                <div
                                    id="posts-${monitor.id}"
                                    class="font-bold
                                           text-emerald-400">
                                    —
                                </div>

                                <div
                                    class="text-xs
                                           text-zinc-500">
                                    Posts
                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- STATUS / TIMER / BUTTON -->

                <div
                    class="mt-6
                           flex
                           flex-col
                           md:flex-row
                           md:items-center
                           md:justify-between
                           gap-5">


                    <div>

                        <div
                            class="text-xs
                                   text-zinc-500">
                            CURRENT STATUS
                        </div>

                        <div
                            id="status-${monitor.id}"
                            class="text-3xl
                                   font-bold
                                   mt-1">
                            —
                        </div>

                    </div>


                    <div class="text-left md:text-right">

                        <div
                            class="text-xs
                                   text-zinc-500">
                            MONITORING TIME
                        </div>

                        <div
                            id="time-${monitor.id}"
                            class="font-mono
                                   text-lg
                                   text-purple-400">
                            00:00:00
                        </div>

                    </div>


                    <button
                        id="btn-${monitor.id}"
                        onclick="
                            event.stopPropagation();
                            toggleMonitor('${monitor.id}')
                        "
                        class="px-7 py-3
                               bg-gradient-to-r
                               from-purple-500
                               to-violet-700
                               text-white
                               rounded-2xl
                               font-bold">

                        START MONITOR

                    </button>

                </div>

            </div>

        </div>
    `;


    list.prepend(card);

}


/* =========================================
   MINIMIZE
========================================= */

function toggleMinimize(id) {

    const card =
        document.getElementById(
            `monitor-${id}`
        );

    if (!card) return;


    card.classList.toggle(
        'minimized'
    );


    const icon =
        document.getElementById(
            `chevron-${id}`
        );


    icon.className =
        card.classList.contains('minimized')

            ? 'fas fa-chevron-right text-zinc-500'

            : 'fas fa-chevron-down text-zinc-500';

}


/* =========================================
   MINIMIZE OTHERS
========================================= */

function minimizeOthers(exceptId) {

    document
        .querySelectorAll('.monitor-card')
        .forEach(card => {

            if (
                card.id !==
                `monitor-${exceptId}`
            ) {

                card.classList.add(
                    'minimized'
                );


                const id =
                    card.id.replace(
                        'monitor-',
                        ''
                    );


                const icon =
                    document.getElementById(
                        `chevron-${id}`
                    );


                if (icon) {

                    icon.className =
                        'fas fa-chevron-right text-zinc-500';

                }

            }

        });

}


/* =========================================
   ADD MONITOR
========================================= */

function addMonitor() {

    const id =
        `m${++monitorCounter}`;


    const monitor = {

        id,

        username: '',

        monitoring: false,

        startedAt: null

    };


    monitors.set(
        id,
        monitor
    );


    renderMonitorCard(
        monitor,
        false
    );


    minimizeOthers(id);


    document
        .getElementById(
            `input-${id}`
        )
        .focus();


    updateCount();


    addLog(
        `New monitor added #${monitorCounter}`
    );

}


/* =========================================
   UPDATE COUNT
========================================= */

function updateCount() {

    document
        .getElementById(
            'monitor-count'
        )
        .textContent =
        monitors.size;

}


/* =========================================
   REMOVE MONITOR
========================================= */

async function removeMonitor(id) {

    const monitor =
        monitors.get(id);


    if (
        monitor?.monitoring &&
        monitor.username
    ) {

        try {

            await fetch(
                '/api/monitor/stop',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            username:
                                monitor.username
                        })
                }
            );

        } catch (e) {}

    }


    monitors.delete(id);


    const card =
        document.getElementById(
            `monitor-${id}`
        );


    if (card) {

        card.style.opacity = '0';

        card.style.transform =
            'scale(.95)';

        setTimeout(
            () => card.remove(),
            200
        );

    }


    updateCount();

}


/* =========================================
   FETCH PROFILE
========================================= */

async function fetchProfile(id) {

    const monitor =
        monitors.get(id);


    const input =
        document.getElementById(
            `input-${id}`
        );


    const username =
        input.value
            .trim()
            .replace('@', '')
            .toLowerCase();


    if (!username) {

        return alert(
            'Enter username'
        );

    }


    monitor.username =
        username;


    document
        .getElementById(
            `mini-user-${id}`
        )
        .textContent =
        username;


    document
        .getElementById(
            `profile-${id}`
        )
        .classList.remove(
            'hidden'
        );


    addLog(
        `Fetching profile for @${username}...`
    );


    try {

        const res =
            await fetch(
                '/api/check',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            username
                        })
                }
            );


        const data =
            await res.json();


        if (
            data.exists &&
            data.user
        ) {

            document
                .getElementById(
                    `pfp-${id}`
                )
                .src =
                data.user.profile_pic ||
                '';


            document
                .getElementById(
                    `fullname-${id}`
                )
                .textContent =
                data.user.full_name ||
                data.user.username;


            document
                .getElementById(
                    `user-${id}`
                )
                .textContent =
                `@${data.user.username}`;


            document
                .getElementById(
                    `bio-${id}`
                )
                .textContent =
                data.user.biography ||
                'No bio';


            document
                .getElementById(
                    `followers-${id}`
                )
                .textContent =
                data.user.followers;


            document
                .getElementById(
                    `following-${id}`
                )
                .textContent =
                data.user.following;


            document
                .getElementById(
                    `posts-${id}`
                )
                .textContent =
                data.user.posts;


            setStatus(
                id,
                'ACTIVE'
            );


            addLog(
                `@${username} → ACTIVE`,
                'active'
            );

        } else {

            document
                .getElementById(
                    `pfp-${id}`
                )
                .src = '';


            document
                .getElementById(
                    `fullname-${id}`
                )
                .textContent =
                username;


            document
                .getElementById(
                    `user-${id}`
                )
                .textContent =
                `@${username}`;


            document
                .getElementById(
                    `bio-${id}`
                )
                .textContent =
                'Account not found or banned';


            document
                .getElementById(
                    `followers-${id}`
                )
                .textContent =
                '—';


            document
                .getElementById(
                    `following-${id}`
                )
                .textContent =
                '—';


            document
                .getElementById(
                    `posts-${id}`
                )
                .textContent =
                '—';


            setStatus(
                id,
                'BANNED'
            );


            addLog(
                `@${username} → BANNED`,
                'banned'
            );

        }

    } catch (e) {

        addLog(
            `@${username}: Failed to fetch profile`,
            'banned'
        );

    }

}


/* =========================================
   SET STATUS
========================================= */

function setStatus(
    id,
    status
) {

    const el =
        document.getElementById(
            `status-${id}`
        );


    const mini =
        document.getElementById(
            `mini-status-${id}`
        );


    el.textContent =
        status;


    el.className =
        status === 'ACTIVE'

            ? 'text-3xl font-bold mt-1 status-active'

            : 'text-3xl font-bold mt-1 status-banned';


    mini.textContent =
        status;


    mini.className =
        status === 'ACTIVE'

            ? 'text-sm font-bold status-active'

            : 'text-sm font-bold status-banned';

}


/* =========================================
   START / STOP MONITOR
========================================= */

async function toggleMonitor(id) {

    const monitor =
        monitors.get(id);


    if (!monitor) return;


    if (!monitor.username) {

        return alert(
            'First check a profile'
        );

    }


    const btn =
        document.getElementById(
            `btn-${id}`
        );


    /* STOP */

    if (monitor.monitoring) {

        try {

            await fetch(
                '/api/monitor/stop',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            username:
                                monitor.username
                        })
                }
            );

        } catch (e) {}


        monitor.monitoring =
            false;

        monitor.startedAt =
            null;


        btn.textContent =
            'START MONITOR';


        btn.className =
            'px-7 py-3 bg-gradient-to-r from-purple-500 to-violet-700 text-white rounded-2xl font-bold';


        addLog(
            `Monitoring stopped for @${monitor.username}`
        );


        return;

    }


    /* START */

    try {

        const res =
            await fetch(
                '/api/monitor/start',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            username:
                                monitor.username
                        })
                }
            );


        const data =
            await res.json();


        if (!data.success) {

            addLog(
                `Failed to start @${monitor.username}`,
                'banned'
            );

            return;

        }


        monitor.monitoring =
            true;


        monitor.startedAt =
            data.startTime ||
            Date.now();


        btn.textContent =
            'STOP MONITOR';


        btn.className =
            'px-7 py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl font-bold';


        addLog(
            `Started monitoring @${monitor.username}`,
            'active'
        );


        minimizeOthers(id);

    } catch (e) {

        addLog(
            `Failed to start @${monitor.username}`,
            'banned'
        );

    }

}


/* =========================================
   RESTORE SAVED MONITORS
========================================= */

async function restoreBackendMonitors() {

    try {

        const res =
            await fetch(
                '/api/monitor/status'
            );


        const data =
            await res.json();


        if (!data.success) {

            addMonitor();

            return;

        }


        /*
           Restore every monitor saved
           by the backend.
        */

        for (
            const saved
            of data.monitors
        ) {

            const id =
                `m${++monitorCounter}`;


            const monitor = {

                id,

                username:
                    saved.username,

                monitoring:
                    true,

                startedAt:
                    saved.startedAt

            };


            monitors.set(
                id,
                monitor
            );


            renderMonitorCard(
                monitor,
                true
            );


            document
                .getElementById(
                    `profile-${id}`
                )
                .classList.remove(
                    'hidden'
                );


            const btn =
                document.getElementById(
                    `btn-${id}`
                );


            btn.textContent =
                'STOP MONITOR';


            btn.className =
                'px-7 py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl font-bold';


            document
                .getElementById(
                    `input-${id}`
                )
                .value =
                saved.username;


            /*
               Load current profile.
            */

            await fetchProfile(id);


            addLog(
                `Restored monitoring @${saved.username}`,
                'active'
            );

        }


        /*
           If nothing was saved,
           create first empty card.
        */

        if (
            monitors.size === 0
        ) {

            addMonitor();

        } else {

            const lastId =
                [...monitors.keys()]
                    .at(-1);

            minimizeOthers(
                lastId
            );

        }


        updateCount();


    } catch (e) {

        addLog(
            'Failed to restore backend monitors',
            'banned'
        );


        if (
            monitors.size === 0
        ) {

            addMonitor();

        }

    }

}


/* =========================================
   LIVE TIMERS
========================================= */

function updateTimers() {

    const now =
        Date.now();


    monitors.forEach(
        monitor => {

            if (
                !monitor.monitoring ||
                !monitor.startedAt
            ) return;


            const seconds =
                Math.floor(
                    (now -
                        monitor.startedAt)
                    / 1000
                );


            const value =
                formatElapsed(
                    seconds
                );


            const big =
                document.getElementById(
                    `time-${monitor.id}`
                );


            const mini =
                document.getElementById(
                    `mini-time-${monitor.id}`
                );


            if (big) {

                big.textContent =
                    value;

            }


            if (mini) {

                mini.textContent =
                    value;

            }

        }
    );

}


setInterval(
    updateTimers,
    1000
);


/* =========================================
   START
========================================= */

window.addEventListener(
    'DOMContentLoaded',
    () => {

        restoreBackendMonitors();

    }
);

</script>
